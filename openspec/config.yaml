schema: spec-driven

# Contexto del proyecto (opcional)
# Esto se muestra a la IA al crear artefactos.
# Incluye el stack técnico, convenciones, guías de estilo, conocimiento de dominio, etc.
context: |
  Stack técnico: TypeScript, Next.js (App Router; frontend y backend en un solo proyecto),
  renderizado del lado del cliente (sin SSR), Turso (libSQL/SQLite) con Drizzle ORM,
  NextAuth (JWT), Cloudflare R2 para archivos, desplegado en Vercel.
  Arquitectura: por capas pragmática — route handlers en `app/api` → capa de servicios → repositorios
  (acceso a datos con Drizzle). Mantener separación de responsabilidades y dominio tipado, sin la
  ceremonia completa de DDD (sin entity.save(), sin 4 capas formales).
  Estado en el cliente: SWR (datos), React Context (sesión/usuario), useReducer (formularios).
  Pruebas: Vitest (unitarias/servicios) y Vitest contra SQLite para E2E (`pnpm test:e2e`). Cobertura pragmática del dominio y de
  los servicios; sin umbral fijo del 90%.
  Commits convencionales (prefijo en inglés `feat:`/`fix:`, descripción en español).
  Dominio: Sistema de Consulta de Títulos del MEP (Ministerio de Educación Pública, Costa Rica) —
  registro de actas de graduación, digitalización de folios y consulta de graduaciones.
  Jerarquía: País → Región → Escuela → Actas → Estudiantes. Roles jerárquicos por nivel
  (Admin País=1 … Staff=4). Actas inmutables. Auditoría inmutable de todo cambio.
  Idioma: TODO el código, comentarios, documentación, esquema de base de datos (tablas/columnas en
  español) y artefactos técnicos van en español (Costa Rica).

  Specs del proyecto (fuente única de verdad): toda creación de artefactos e implementación DEBE
  seguir el contexto técnico en docs/. Leer y aplicar:
  - docs/brd.md — documento de requerimientos de negocio (BRD); fuente de verdad del producto
  - docs/base-standards.md — principios fundamentales, TDD, estándar de idioma, enlaces a estándares
  - docs/backend-standards.md — API (route handlers), Drizzle/Turso, pruebas, seguridad (backend)
  - docs/frontend-standards.md — Next.js/React, UI/UX, estado (frontend)
  - docs/api-spec.yml — contratos de API y definición de endpoints (crear por proyecto)
  - docs/data-model.md — modelo de dominio y de datos (crear por proyecto)
  - docs/documentation-standards.md — estructura y mantenimiento de la documentación

# Reglas por artefacto (opcional)
rules:
  # Global: aplicar los estándares al crear cualquier artefacto
  _global:
    - Antes de crear cualquier artefacto, leer y aplicar docs/base-standards.md y docs/brd.md
    - Para artefactos de backend, leer y aplicar docs/backend-standards.md
    - Para artefactos de frontend, leer y aplicar docs/frontend-standards.md
    - Usar docs/api-spec.yml y docs/data-model.md para consistencia de API y de datos en specs y tareas
    - Todo el contenido (código, esquema, documentación, nombres de tablas/columnas) va en español

  # Reglas para tareas (tasks.md)
  tasks:
    - Dividir las tareas en bloques de máximo 2 horas
    - |
      Seguir TDD: escribir la prueba que falla primero, luego implementar hasta ponerla en verde
    - |
      Pasos obligatorios por cambio: crear rama de feature; escribir/actualizar pruebas (Vitest);
      ejecutar pruebas; verificación E2E (`pnpm test:e2e`) cuando cambie la persistencia o un flujo de usuario;
      actualizar documentación
    - |
      No incluir pasos de "curl manual"; la API se prueba con pruebas de route handlers/servicios

  # Reglas para specs / planes de implementación
  spec:
    - Las specs deben referenciar los requisitos del BRD (docs/brd.md) y reflejar el modelo de datos (docs/data-model.md)
    - Para cambios de datos, especificar tablas/columnas de Drizzle (nombres en español) y la migración correspondiente
    - Definir el control de acceso por rol (Admin País/Regional/Escuela/Staff) para cada endpoint nuevo
    - Toda escritura debe registrar auditoría (usuario, tabla, acción, datos_anteriores, datos_nuevos)

  # Reglas específicas de backend
  backend:
    - |
      Arquitectura por capas pragmática: route handler (app/api) → servicio → repositorio (Drizzle).
      El route handler no accede directamente a la base de datos; delega en la capa de servicios.
    - |
      Seguridad: el token de Turso y las credenciales de R2 viven solo en el servidor
      (variables de entorno de Vercel); nunca llegan al navegador. Las imágenes se sirven con
      URLs firmadas de corta duración generadas en el servidor.
    - |
      Validación de entrada en el límite del API y verificación de rol según la jerarquía
      en cada petición antes de ejecutar la acción.
    - |
      Respuestas de error con cuerpo JSON y mapeo de estado HTTP (400, 401, 403, 404, 409, 500).
    - |
      Pruebas con Vitest (servicios y repositorios con datos de prueba); restaurar el estado de la
      base tras pruebas que escriben. Cobertura pragmática, sin umbral fijo.
    - |
      Documentación — cambios de datos → docs/data-model.md; cambios de API → docs/api-spec.yml.
      Todo en español.

  # Reglas específicas de frontend
  frontend:
    - |
      Componentes React en Next.js (App Router), renderizado en cliente. Datos con SWR,
      sesión con React Context, formularios con useReducer. Sin acceso directo a la base
      de datos desde el cliente: siempre vía route handlers de `app/api`.
    - |
      Usar tokens de diseño / variables CSS para la identidad MEP (azul/dorado/blanco);
      sin colores embebidos. Accesibilidad WCAG AA.
    - |
      Toda la interfaz, mensajes y textos en español (Costa Rica).

# Bootstrap de Gentle AI SDD (agregado por sdd-init, 2026-09-29)
artifact_language: es-CR  # Español neutro y profesional (Costa Rica); ver CLAUDE.md sección 2

projects:
  - path: .
    stack: TypeScript, Next.js 16 (App Router), React 19, Drizzle ORM + Turso (libSQL), NextAuth v5, Cloudflare R2, Tailwind 4
    package_manager: pnpm@10.33.1
    test_command: pnpm test
    e2e_command: pnpm test:e2e

strict_tdd: true  # Fuente: convención del proyecto (CLAUDE.md "Desarrollo guiado por pruebas") + comando de pruebas a nivel de espacio de trabajo (pnpm test)

testing:
  strict_tdd: true
  runner:
    name: vitest
    command: pnpm test
    watch: pnpm test:watch
  layers:
    unit:
      available: true
      tool: vitest (config vitest.config.mts, entorno node, incluye **/*.{test,spec}.{ts,tsx})
    integration:
      available: true
      tool: "@testing-library/react + jsdom (servicios/repositorios con datos de prueba)"
    e2e:
      available: true
      tool: vitest e2e (config vitest.e2e.config.mts, test/e2e/**/*.test.ts)
      command: pnpm test:e2e
  coverage:
    available: false
    command: null
    note: "@vitest/coverage-* no está instalado"
  quality:
    linter: pnpm lint          # eslint 9 + eslint-config-next + eslint-plugin-security
    type_checker: pnpm typecheck  # tsc --noEmit
    formatter: null
  verify:
    fast: pnpm verify:fast     # lint + typecheck + test
    full: pnpm verify          # verify:fast + test:e2e
    ci: pnpm verify:ci
